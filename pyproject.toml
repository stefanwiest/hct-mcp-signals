[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hct-mcp-signals"
version = "0.1.0"
description = "HCT Coordination Signals Extension for MCP - Adds urgency, timing, and approval semantics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Stefan Wiest", email = "mail@stefanwiest.de" }
]
keywords = ["mcp", "model-context-protocol", "agents", "coordination", "hct"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/stefanwiest/hct-mcp-signals"
Documentation = "https://github.com/stefanwiest/hct-mcp-signals#readme"
Repository = "https://github.com/stefanwiest/hct-mcp-signals"

[tool.hatch.build.targets.wheel]
packages = ["hct_mcp_signals"]

[tool.hatch.build.targets.sdist]
include = [
    "hct_mcp_signals/**/*.py",
    "hct_mcp_signals/py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
